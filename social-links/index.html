<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Lupin 社群連結</title>
    <style>
      :root {
        color-scheme: light dark;
        --blue: #347fc4;
        --blue-dark: #2869a8;
        --white: #ffffff;
        --motion: 160ms;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: transparent;
      }

      html {
        height: 100%;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100%;
        padding: 8px;
        background: transparent;
        overflow: hidden;
      }

      .social-links {
        display: flex;
        flex-wrap: nowrap;
        justify-content: center;
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .social-link {
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        color: var(--blue);
        background: rgb(255 255 255 / 75%);
        border: 0;
        border-radius: 50%;
        cursor: pointer;
        transition:
          color var(--motion) ease,
          background-color var(--motion) ease,
          transform var(--motion) ease;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      .social-link svg {
        width: 18px;
        height: 18px;
      }

      .social-link:hover {
        color: var(--white);
        background: var(--blue-dark);
        transform: translateY(-2px);
      }

      .social-link:active {
        transform: translateY(2px) scale(0.96);
      }

      .social-link:focus-visible {
        outline: 3px solid var(--blue-dark);
        outline-offset: -3px;
      }

      @media (prefers-reduced-motion: reduce) {
        .social-link {
          transition: none;
        }
      }
    </style>
  </head>
