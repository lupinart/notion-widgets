<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>鹿苹視覺｜社群連結</title>
  <script>
    const requestedTheme = new URLSearchParams(location.search).get('theme');
    if (requestedTheme === 'light' || requestedTheme === 'dark') {
      document.documentElement.dataset.theme = requestedTheme;
    }
  </script>
  <style>
    :root {
      color-scheme: light dark;
      --ink: light-dark(#2c2c2a, #f0efec);
      --front: light-dark(#f7f6f5, #373735);
      --border: light-dark(#e3e1de, #4c4c49);
      --accent: light-dark(#286897, #8dbde6);
      --reverse: light-dark(#244e74, #88b5da);
      --reverse-ink: light-dark(#f5f9fc, #182d3f);
      --motion: 280ms cubic-bezier(.22, 1, .36, 1);
    }

    :root[data-theme="light"] { color-scheme: only light; }
    :root[data-theme="dark"] { color-scheme: only dark; }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: transparent;
    }

    body {
      padding: 5px;
      font: 600 13px/1.2 "IBM Plex Mono", ui-monospace, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    .social-links {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .social-link {
      display: block;
      min-width: 0;
      border-radius: 7px;
      perspective: 560px;
      text-decoration: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .social-link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .card {
      display: grid;
      min-height: 54px;
      transform-style: preserve-3d;
      transition: transform var(--motion);
    }

    .face {
      display: flex;
      grid-area: 1 / 1;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 6px 5px;
      border: 1px solid var(--border);
      border-radius: 7px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      white-space: nowrap;
    }

    .front {
      background: var(--front);
      color: var(--ink);
    }

    .front svg {
      flex: 0 0 16px;
      width: 16px;
      height: 16px;
      color: var(--accent);
    }

    .back {
      background: var(--reverse);
      color: var(--reverse-ink);
      transform: rotateX(180deg);
      font-size: 12px;
    }

    .arrow { font-size: 14px; }

    .social-link:is(:focus-visible, [data-flipped]) .card {
      transform: rotateX(180deg);
    }

    @media (hover: hover) and (pointer: fine) {
      .social-link:hover .card { transform: rotateX(180deg); }
    }

    @media (max-width: 519px) {
      .social-links { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 259px) {
      .social-links { grid-template-columns: minmax(0, 1fr); }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
    }
  </style>
</head>
<body>
  <nav class="social-links" aria-label="鹿苹視覺的社群連結">
      <a class="social-link" href="https://lupinvisual.com/" target="_blank" rel="noopener noreferrer" aria-label="開啟官網">
        <span class="card" aria-hidden="true">
          <span class="face front">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M3 12h18M12 3c2.25 2.47 3.4 5.47 3.4 9S14.25 18.53 12 21M12 3C9.75 5.47 8.6 8.47 8.6 12s1.15 6.53 3.4 9"></path>
            </svg>
            <span>官網</span>
          </span>
          <span class="face back">
            <span>開啟官網</span><span class="arrow">↗</span>
          </span>
        </span>
      </a>
      <a class="social-link" href="https://www.facebook.com/profile.php?id=61582371620174" target="_blank" rel="noopener noreferrer" aria-label="前往 Facebook">
        <span class="card" aria-hidden="true">
          <span class="face front">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
              <path d="M9.101 23.691v-7.98H6.627v-3.667h2.474v-1.58c0-4.085 1.848-5.978 5.858-5.978.401 0 .955.042 1.468.103.51.06.9.138 1.141.195v3.325a8.623 8.623 0 0 0-.653-.036 26.805 26.805 0 0 0-.733-.009c-.707 0-1.259.096-1.675.309a1.686 1.686 0 0 0-.679.622c-.258.42-.374.995-.374 1.752v1.297h3.919l-.673 3.667h-3.246v8.245C19.396 23.238 24 18.179 24 12.044c0-6.627-5.373-12-12-12S0 5.417 0 12.044c0 5.628 3.874 10.35 9.101 11.647Z"></path>
            </svg>
            <span>Facebook</span>
          </span>
          <span class="face back">
            <span>前往 Facebook</span><span class="arrow">↗</span>
          </span>
        </span>
      </a>
      <a class="social-link" href="https://www.threads.com/@lupin_visual" target="_blank" rel="noopener noreferrer" aria-label="前往 Threads">
        <span class="card" aria-hidden="true">
          <span class="face front">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18.263 11.097c-.03-3.486-1.92-5.586-5.111-5.586-2.13 0-3.922.963-4.863 2.499l2.062 1.438c.535-.843 1.272-1.543 2.628-1.543 1.528 0 2.318.85 2.544 2.431a15 15 0 0 0-2.236-.173c-4.125 0-6.068 1.867-6.068 4.336s1.943 3.99 4.804 3.99c3.139 0 5.013-2.115 5.781-4.735.798.361 1.348 1.204 1.348 2.47 0 3.387-3.907 5.232-7.22 5.232-4.885 0-8.077-3.207-8.077-8.424 0-6.392 4.223-10.487 9.9-10.487 3.808 0 5.69 1.671 6.97 3.914l2.108-1.475C21.44 2.078 18.331 0 13.663 0 6.227 0 1.168 5.277 1.168 12.934c0 7 4.953 11.066 10.856 11.066 4.878 0 9.809-2.846 9.809-7.716 0-2.545-1.46-4.231-3.569-5.187m-6.33 4.855c-1.077 0-2.026-.512-2.026-1.453 0-1.483 1.822-1.934 3.606-1.934.678 0 1.34.045 1.927.173-.422 1.927-1.671 3.215-3.508 3.214Z"></path>
            </svg>
            <span>Threads</span>

      <a class="social-link" href="mailto:lupinart1008@gmail.com" aria-label="撰寫郵件">
        <span class="card" aria-hidden="true">
          <span class="face front">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="m4 7 8 6 8-6"></path>
            </svg>
            <span>Email</span>
          </span>
          <span class="face back">
            <span>撰寫郵件</span><span class="arrow">↗</span>
          </span>
        </span>
      </a>
  </nav>
  <script>
    const links = document.querySelector('.social-links');
    let flipped;
    let pointerType;

    function resetFlip() {
      flipped?.removeAttribute('data-flipped');
      flipped = undefined;
    }

    links.addEventListener('pointerdown', (event) => {
      pointerType = event.pointerType;
    });

    links.addEventListener('pointercancel', () => {
      pointerType = undefined;
    });

    links.addEventListener('click', (event) => {
      const link = event.target.closest('.social-link');
      const touch = event.detail > 0 && ['touch', 'pen'].includes(event.pointerType || pointerType);
      pointerType = undefined;
      if (!link || !touch || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      if (flipped === link) {
        resetFlip();
        return;
      }
      event.preventDefault();
      resetFlip();
      flipped = link;
      link.setAttribute('data-flipped', '');
    });

    document.addEventListener('pointerdown', (event) => {
      if (flipped && !flipped.contains(event.target)) resetFlip();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') resetFlip();
    });
  </script>
</body>
</html>
